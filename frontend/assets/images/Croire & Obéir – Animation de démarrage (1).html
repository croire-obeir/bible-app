<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croire & Obéir – Animation de démarrage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&display=swap">
<style>
:root{--bg:#ffffff;--fg:#2a2230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:'Quicksand',system-ui,sans-serif}
svg{width:min(78vw,420px);height:auto;overflow:visible}
.ring{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:300px 300px}
.gold{stroke:#E6B422;stroke-width:14;stroke-dasharray:1696;stroke-dashoffset:1696;animation:draw 1.2s ease-out .1s forwards}
.white{stroke:#fff;stroke-width:12;stroke-dasharray:1583;stroke-dashoffset:1583;animation:draw2 1.1s ease-out .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes draw2{to{stroke-dashoffset:0}}
.disc{fill:#F0B400;transform-origin:300px 300px;transform:scale(0);animation:pop .7s cubic-bezier(.2,1.4,.4,1) .9s forwards}
@keyframes pop{to{transform:scale(1)}}
.book{opacity:0;transform:translateY(30px);animation:rise .8s ease-out 1.4s forwards}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.page{fill:#FBF3C8;stroke:#3a2a3a;stroke-width:2.5;stroke-linejoin:round}
.flip{transform:scaleX(-1);animation:flip 1.1s ease-in-out infinite;animation-delay:calc(2.1s + var(--d))}
@keyframes flip{0%{transform:scaleX(-1)}45%,100%{transform:scaleX(1)}}
.txt{font-family:'Quicksand',system-ui,sans-serif;font-weight:600;font-size:44px;fill:#2a2230;opacity:0;transform:translateY(14px);animation:rise .8s ease-out 2.2s forwards}
.bar{width:min(50vw,240px);height:5px;border-radius:5px;background:#2a223018;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#F0B400;border-radius:5px;animation:load 3.2s ease-in-out 1.6s forwards}
@keyframes load{to{width:100%}}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid #2a223055;border-radius:999px;padding:8px 20px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 600 600" role="img" aria-label="Logo Croire et Obéir">
  <circle class="ring gold" cx="300" cy="300" r="270"/>
  <circle class="ring white" cx="300" cy="300" r="252"/>
  <circle class="disc" cx="300" cy="300" r="236"/>
  <g transform="translate(100 190)"><g class="book">
    <path d="M20 150 L200 215 L380 165 L380 182 L200 235 L20 168Z" fill="#E8728F" stroke="#3a2a3a" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon class="page" points="200,205 28,150 52,58 200,128"/>
    <polygon class="page" points="200,205 372,162 346,62 200,128"/>
    <g transform="translate(200 205)">
      <g class="flip" style="--d:0s"><polygon class="page" points="0,0 150,-70 125,-165 0,-80"/></g>
      <g class="flip" style="--d:.22s"><polygon class="page" points="0,0 165,-55 140,-150 0,-72"/></g>
      <g class="flip" style="--d:.44s"><polygon class="page" points="0,0 120,-95 100,-190 0,-95"/></g>
    </g>
  </g></g>
  <text class="txt" x="300" y="478" text-anchor="middle">croire &amp; obéir</text>
</svg>
<div class="bar" style="margin:0 auto"><i></i></div>
</div>
<button id="replay" type="button">Rejouer l’animation</button>
<script>
document.getElementById('replay').addEventListener('click',function(){
  var s=document.getElementById('stage');var c=s.cloneNode(true);s.replaceWith(c);
});
</script>
</body>
</html>
